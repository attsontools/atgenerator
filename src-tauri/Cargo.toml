[package]
name = "atgenerator"
version = "0.1.0-alpha.0"
description = "密码、ID、二维码与随机数据生成工具"
authors = ["Attson"]
edition = "2021"

[lib]
name = "atgenerator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.7.0"
base64 = "0.23"

